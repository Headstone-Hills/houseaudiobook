name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: make setup
      - run: make check

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: make setup
      - run: cd web && npx playwright install --with-deps chromium
      - run: make e2e

  # The macOS app (M9): build the engine + Tauri shell, ad-hoc signed, then
  # smoke-test it (the app starts its engine; a real first run inside it).
  macos-app:
    runs-on: macos-14  # Apple Silicon (arm64)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
      - name: Cache the ffmpeg build
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-arm64
          key: ffmpeg-macos-arm64-${{ hashFiles('scripts/build_ffmpeg.sh') }}
      - name: Launcher tests
        run: cd shell && cargo test -p hillaudio-launcher
      - name: Build and smoke-test HillAudiobook.app
        run: scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HillAudiobook-macos-arm64
          path: |
            shell/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
      # The LGPL source offer for the bundled ffmpeg: publish it with each release.
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-source
          path: build/ffmpeg-arm64/source/
          if-no-files-found: error
          retention-days: 14
